# Synthetic ssh-config rendering for tests/test_deck_config.py.
#
# Shaped like the tmux aliases the operator's own ssh-alias installer writes
# (that script is excluded from the Builder export), carrying only what
# deck_config.rail_from_ssh_config reads: one `tmux new -s <session> -c
# <workdir>` per alias, in order, with one session name repeated under a
# second alias to exercise the first-occurrence rule.

Host steward
  HostName @CREW_HOST@
  RequestTTY yes
  RemoteCommand printf '\033]1337;SetProfile=co-convivy\a'; ~/.local/bin/session-agent ensure-server && (tmux attach -d -t steward || tmux new -s steward -c @MINI_ROOT@/substrate)

Host vivy
  HostName @CREW_HOST@
  RequestTTY yes
  RemoteCommand printf '\033]1337;SetProfile=co-vivy\a'; ~/.local/bin/session-agent ensure-server && (tmux attach -d -t vivy || tmux new -s vivy -c @MINI_ROOT@/vivy)

Host svc
  HostName @CREW_HOST@
  RequestTTY yes
  RemoteCommand printf '\033]1337;SetProfile=co-svc\a'; ~/.local/bin/session-agent ensure-server && (tmux attach -d -t svc || tmux new -s svc -c @MINI_ROOT@/convivy-app-kit)

Host nyh-etc
  HostName @CREW_HOST@
  RequestTTY yes
  RemoteCommand printf '\033]1337;SetProfile=co-nyh-etc\a'; ~/.local/bin/session-agent ensure-server && (tmux attach -d -t nyh-etc || tmux new -s nyh-etc -c @MINI_ROOT@/nyh-architecture/nyh-etc)

# macmini-steward repeats the crew's `steward` session on the standby root. The
# rail keeps a session's first occurrence, so this row is correctly absent
# from the derived rail.
Host macmini-steward
  HostName @STANDBY_HOST@
  RequestTTY yes
  RemoteCommand printf '\033]1337;SetProfile=co-convivy\a'; ~/.local/bin/session-agent ensure-server && (tmux attach -d -t steward || tmux new -s steward -c @STANDBY_ROOT@/substrate)
